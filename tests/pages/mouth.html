<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>입안 단면도 점검</title>
<!-- 점검 전용: 입안 단면도(G.mouth)만 따로 띄운다. index.html 등록은 연결 단계에서 한다.
     ?sea=consonant|vowel  &grade=m3|h1  &names=0(이름 숨김)  &reduce=1(움직임 줄이기)
     &w=360&h=640  → 그 크기의 세로 상자 안에 띄운다(캡처용. aside는 frame.html 안을 캡처하지 못해서 따로 둠)
     window.mouth = 만든 단면도(보여 주기 전용 — 누르는 자리가 없다) -->
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/fonts.css">
<link rel="stylesheet" href="../../css/mouth.css">
<style>
  html, body { height: 100%; }
  #stage { height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #box { width: min(100%, 760px); height: min(100%, 720px); }
  @media (orientation: portrait) {
    #stage { align-items: flex-start; }
    #box { width: 100%; height: auto; }
  }
  /* 캡처용 고정 크기 세로 상자(휴대폰 세로 배치 흉내) */
  #stage.fixed { --touch: 48px; height: auto; margin: 0; align-items: flex-start; outline: 1px solid var(--ink-3); background: var(--paper); }
  #stage.fixed #box { width: 100%; height: auto; }
  body.fixed-page { background: #999; }
</style>
</head><body>
<div id="stage"><div id="box"></div></div>
<script src="../../js/core/util.js"></script>
<script src="../../js/data/text.js"></script>
<script src="../../js/data/mouth.js"></script>
<script src="../../js/game/mouth.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('reduce')) document.documentElement.classList.add('reduce-motion');
  if (q.get('w')) {
    const sg = document.getElementById('stage');
    sg.classList.add('fixed'); document.body.classList.add('fixed-page');
    sg.style.width = q.get('w') + 'px'; sg.style.height = (q.get('h') || 640) + 'px';
  }
  window.mouth = G.mouth.create(document.getElementById('box'), {
    sea: q.get('sea') || 'consonant', grade: q.get('grade') || 'm3', showNames: q.get('names') !== '0',
  });
</script>
</body></html>
